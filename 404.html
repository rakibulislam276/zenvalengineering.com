<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Not Found | Zenval Engineering</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #fff;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

.container {
    max-width: 500px;
}

h1 {
    font-size: 110px;
    color: #22c55e;
    margin: 0;
}

h2 {
    margin: 10px 0;
}

p {
    color: #cbd5f5;
}

.buttons {
    margin-top: 25px;
}

.btn {
    display: inline-block;
    margin: 10px;
    padding: 12px 20px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 500;
}

.home {
    background: #22c55e;
    color: #000;
}

.home:hover {
    background: #16a34a;
}

.whatsapp {
    background: #25D366;
    color: #000;
}

.whatsapp:hover {
    background: #1ebe5d;
}

.footer {
    margin-top: 30px;
    font-size: 14px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">

<h1>404</h1>
<h2>Page Not Found</h2>
<p>The page you are looking for doesn’t exist or has been moved.</p>
<p>Redirecting to products page in <span id="countdown">5</span> seconds...</p>

<div class="buttons">
    <a href="/" class="btn home">🏠 Homepage</a>
    <a href="https://wa.me/919423569124?text=Hello%20I%20need%20help%20with%20valves" target="_blank" class="btn whatsapp">💬 WhatsApp</a>
</div>

<div class="footer">
    Zenval Engineering | Industrial Valve Supplier in India
</div>

</div>

<script>
// ⏳ COUNTDOWN + REDIRECT
let timeLeft = 5;
let countdownElement = document.getElementById("countdown");

let timer = setInterval(function() {
    timeLeft--;
    countdownElement.textContent = timeLeft;

    if(timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = "/products.html";
    }
}, 1000);
</script>

</body>
</html>
